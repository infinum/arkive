name: Deploy showcase to GitHub Pages
on:
  push:
    branches: [ 'main' ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  JAVA_VERSION: 21

jobs:
  build:
    name: Generate showcase
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v4
        continue-on-error: true
        timeout-minutes: 5
        with:
          cache-overwrite-existing: true
          gradle-home-cache-cleanup: true

      # The samples consume the published plugin, so bootstrap mavenLocal first.
      - name: Publish to mavenLocal (bootstrap)
        run: ./gradlew publishToMavenLocal

      # Records Paparazzi snapshots and generates the showcase site for both samples
      # (a standalone build with its own toolchain — see samples/settings.gradle.kts).
      - name: Generate web showcase
        working-directory: samples
        run: ./gradlew generateWebShowcase

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload showcase site
        uses: actions/upload-pages-artifact@v3
        with:
          path: samples/build/generated/arkive/showcase

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
