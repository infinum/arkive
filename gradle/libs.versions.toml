[versions]
appcompat = "1.7.0"
androidGradlePlugin = "8.6.0"
detekt = "1.23.6"
dokka = "1.9.10"
kotlin = "2.0.20"
kotlinxSerializationJson = "1.7.3"
ksp = "2.0.20-1.0.25"
koltinpoet = "1.16.0"
compose-bom = "2024.10.01"
arkive = "0.0.1"
paparazzi = "1.3.4"
junitJupiter = "5.9.1"
junit = "4.13.2"
jetbrainsKotlinJvm = "2.0.20"
plugin = "0.0.1"


[plugins]
detekt-plugin = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
jetbrains-kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "jetbrainsKotlinJvm" }
arkive = { id = "com.infinum.arkive.plugin.gradle.plugin", version.ref = "plugin" }

[libraries]
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
detekt-formatting = { module = "io.gitlab.arturbosch.detekt:detekt-formatting", version.ref = "detekt" }
dokka-plugin = { module = "org.jetbrains.dokka:dokka-gradle-plugin", version.ref = "dokka" }
kotlin-core = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }
kotlin-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerializationJson" }
arkive-metadata = { module = "com.infinum.arkive:metadata", version.ref = "arkive" }
arkive-plugin = { module = "com.infinum.arkive:arkive-plugin", version.ref = "arkive" }
tools-gradle = { module = "com.android.tools.build:gradle", version.ref = "androidGradlePlugin" }
ksp-api = { module = "com.google.devtools.ksp:symbol-processing-api", version.ref = "ksp" }
kotlinpoet-ksp = { module = "com.squareup:kotlinpoet-ksp", version.ref = "koltinpoet" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
junit-vintage-engine = { module = "org.junit.vintage:junit-vintage-engine", version.ref = "junitJupiter" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
paparazzi-plugin = { module = "app.cash.paparazzi:paparazzi-gradle-plugin", version.ref = "paparazzi" }


[bundles]
compose = [
    "compose-material3",
    "compose-ui",
    "compose-ui-tooling-preview",
]