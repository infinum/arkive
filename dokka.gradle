apply plugin: "org.jetbrains.dokka"
apply plugin: "org.jetbrains.dokka-javadoc"

dokka {
    dokkaPublications.named("javadoc") {
        outputDirectory.set(layout.buildDirectory.dir("javadoc"))
    }

    dokkaSourceSets.named("main") {
        // TODO add dokka configuration
    }

    // Android modules: the AGP variant source sets ("release", "debug") duplicate the
    // source roots already owned by "androidJvm", which fails Dokka's pre-generation
    // validity check ("Every Kotlin source file should belong to only one source set",
    // https://github.com/Kotlin/dokka/issues/3701). Keep a single owner per root.
    dokkaSourceSets.configureEach {
        if (name != "main" && name != "androidJvm") {
            suppress.set(true)
        }
    }
}