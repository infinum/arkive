apply plugin: "org.jetbrains.dokka"
apply plugin: "org.jetbrains.dokka-javadoc"

dokka {
    dokkaPublications.named("javadoc") {
        outputDirectory.set(layout.buildDirectory.dir("javadoc"))
    }

    // Known Dokka+AGP issue (https://github.com/Kotlin/dokka/issues/3701): on Android
    // modules the "androidJvm" source set and the variant-named ones ("debug"/"release")
    // report the same source roots, which fails Dokka's pre-generation check. Suppress
    // the variant duplicates so each module documents a single source set.
    dokkaSourceSets.configureEach {
        if (name == "debug" || name == "release") {
            suppress = true
        }
    }
}
