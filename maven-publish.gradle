apply plugin: "maven-publish"
apply plugin: "signing"

task javadocsJar(type: Jar, dependsOn: "dokkaJavadoc") {
    getArchiveClassifier().set("javadoc")
    from dokkaJavadoc.outputDirectory
}

task sourcesJar(type: Jar) {
    getArchiveClassifier().set("sources")
    if (project.plugins.hasPlugin('com.android.application')
        || project.plugins.hasPlugin('com.android.library')) {
        from android.sourceSets.main.kotlin.srcDirs
    } else {
        from sourceSets.main.allJava
    }
}

afterEvaluate {
    def properties = project.ext.mavenPublishProperties

    publishing {
        repositories {
            maven {
                name "SonatypeMavenCentral"
                url properties.repository.url
                credentials {
                    username properties.repository.username
                    password properties.repository.password
                }
            }
        }
        publications {
            release(MavenPublication) {
                if (project.plugins.hasPlugin('com.android.library')) {
                    from components.release
                } else {
                    from components.java
                }

                groupId = properties.group
                version = properties.version
                artifactId = properties.artifactId

                if (!project.plugins.hasPlugin('com.android.library')) {
                    artifact sourcesJar
                }
                artifact javadocsJar

                pom {
                    name = properties.name
                    description = properties.description
                    url = properties.url
                    licenses {
                        license {
                            name = 'The Apache License, Version 2.0'
                            url = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
                        }
                    }
                    organization {
                        name = 'Infinum Inc.'
                        url = 'https://infinum.com'
                    }
                    developers {
                        developer {
                            id = 'Infinum'
                            name = 'Infinum Inc.'
                            url = 'https://infinum.com'
                        }
                    }
                    scm {
                        connection.set(properties.scm.connection)
                        developerConnection.set(properties.scm.connection)
                        url.set(properties.scm.url)
                    }
                }
            }

            if (project.plugins.hasPlugin('java-gradle-plugin')) {
                // Configures POM metadata on the marker publication auto-generated by java-gradle-plugin.
                // Publication name = pluginDeclarationName + "PluginMarkerMaven"
                // create("arkive") → arkivePluginMarkerMaven
                arkivePluginMarkerMaven(MavenPublication) { publication ->
                    publication.pom {
                        name = properties.name
                        description = properties.description
                        url = properties.url
                        licenses {
                            license {
                                name = 'The Apache License, Version 2.0'
                                url = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
                            }
                        }
                        organization {
                            name = 'Infinum Inc.'
                            url = 'https://infinum.com'
                        }
                        developers {
                            developer {
                                id = 'Infinum'
                                name = 'Infinum Inc.'
                                url = 'https://infinum.com'
                            }
                        }
                        scm {
                            connection = properties.scm.connection
                            developerConnection = properties.scm.connection
                            url = properties.scm.url
                        }
                    }
                }
            }
        }
    }

    signing {
        sign publishing.publications
    }

    tasks.withType(AbstractPublishToMaven).configureEach {
        dependsOn(tasks.withType(Sign))
    }

    tasks.withType(GenerateModuleMetadata).configureEach {
        dependsOn(sourcesJar, javadocsJar)
    }

    tasks.register("deployAll") { task ->
        task.dependsOn("publishReleasePublicationToSonatypeMavenCentralRepository")
        if (project.plugins.hasPlugin('java-gradle-plugin')) {
            task.dependsOn("publishArkivePluginMarkerMavenPublicationToSonatypeMavenCentralRepository")
        }
    }
}
