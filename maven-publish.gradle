apply plugin: "maven-publish"
apply plugin: "signing"

// KMP modules publish through the publications the Kotlin plugin creates itself (one per
// target plus the root), each with its own sources jar — so the hand-rolled jars below
// only exist for single-target modules.
def isKmpModule = project.plugins.hasPlugin('org.jetbrains.kotlin.multiplatform')

if (!isKmpModule) {
    task javadocsJar(type: Jar, dependsOn: "dokkaGeneratePublicationJavadoc") {
        getArchiveClassifier().set("javadoc")
        from dokkaGeneratePublicationJavadoc.outputDirectory
    }

    task sourcesJar(type: Jar) {
        getArchiveClassifier().set("sources")
        if (project.plugins.hasPlugin('com.android.application')
            || project.plugins.hasPlugin('com.android.library')) {
            from android.sourceSets.main.kotlin.srcDirs
        } else {
            from sourceSets.main.allJava
        }
    }
}

// Shared POM metadata, applied to every publication a module produces.
def fillPom = { pomObject, properties ->
    pomObject.name = properties.name
    pomObject.description = properties.description
    pomObject.url = properties.url
    pomObject.licenses {
        license {
            name = 'The Apache License, Version 2.0'
            url = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
        }
    }
    pomObject.organization {
        name = 'Infinum Inc.'
        url = 'https://infinum.com'
    }
    pomObject.developers {
        developer {
            id = 'Infinum'
            name = 'Infinum Inc.'
            url = 'https://infinum.com'
        }
    }
    pomObject.scm {
        connection = properties.scm.connection
        developerConnection = properties.scm.connection
        url = properties.scm.url
    }
}

afterEvaluate {
    def properties = project.ext.mavenPublishProperties

    publishing {
        repositories {
            maven {
                name "SonatypeMavenCentral"
                url properties.repository.url
                credentials {
                    username properties.repository.username
                    password properties.repository.password
                }
            }
        }
        publications {
            if (project.plugins.hasPlugin('java-gradle-plugin')) {
                // Gradle-plugin module: publish the implementation through the auto-created
                // `pluginMaven` publication (renamed to the desired artifactId). The marker
                // generated by `java-gradle-plugin` derives its dependency from pluginMaven's
                // coordinates, so both converge on `<group>:<artifactId>:<version>`. We do NOT
                // create the generic `release` publication here — it would collide on coordinates.
                pluginMaven(MavenPublication) {
                    groupId = properties.group
                    version = properties.version
                    artifactId = properties.artifactId

                    artifact sourcesJar
                    artifact javadocsJar

                    pom { fillPom(it, properties) }
                }

                // POM metadata on the marker publication auto-generated by java-gradle-plugin.
                // Publication name = pluginDeclarationName + "PluginMarkerMaven"
                // create("arkive") → arkivePluginMarkerMaven
                arkivePluginMarkerMaven(MavenPublication) { publication ->
                    publication.pom { fillPom(it, properties) }
                }
            } else if (!isKmpModule) {
                release(MavenPublication) {
                    if (project.plugins.hasPlugin('com.android.library')) {
                        from components.release
                    } else {
                        from components.java
                    }

                    groupId = properties.group
                    version = properties.version
                    artifactId = properties.artifactId

                    if (!project.plugins.hasPlugin('com.android.library')) {
                        artifact sourcesJar
                    }
                    artifact javadocsJar

                    pom { fillPom(it, properties) }
                }
            }
        }

        if (isKmpModule) {
            // Decorate the KMP-created publications: coordinates already come from the
            // project (group/version set in the module script, artifactId from the project
            // name), sources jars are attached by the Kotlin plugin. Central additionally
            // requires a javadoc classifier on every publication — attach an empty one per
            // publication (Dokka's javadoc format cannot render multiplatform modules;
            // empty javadoc jars are the accepted KMP convention on Central).
            publications.withType(MavenPublication).configureEach { publication ->
                def javadocTask = tasks.findByName("${publication.name}JavadocsJar")
                    ?: tasks.create("${publication.name}JavadocsJar", Jar) {
                        getArchiveClassifier().set("javadoc")
                        getArchiveAppendix().set(publication.name.toLowerCase())
                    }
                publication.artifact(javadocTask)
                publication.pom { fillPom(it, properties) }
            }
        }
    }

    signing {
        // Signing is mandatory only when deploying to Maven Central. With no signing key
        // configured (e.g. CI running publishToMavenLocal), the Sign tasks are skipped;
        // a Central deploy without a key still fails loudly.
        required = { gradle.taskGraph.allTasks.any { it.name.contains("SonatypeMavenCentral") } }
        sign publishing.publications
    }

    tasks.withType(AbstractPublishToMaven).configureEach {
        dependsOn(tasks.withType(Sign))
    }

    if (!isKmpModule) {
        tasks.withType(GenerateModuleMetadata).configureEach {
            dependsOn(sourcesJar, javadocsJar)
        }
    }

    tasks.register("deployAll") { task ->
        if (project.plugins.hasPlugin('java-gradle-plugin')) {
            // Plugin module ships via pluginMaven (the impl) + its marker; there is no `release`.
            task.dependsOn("publishPluginMavenPublicationToSonatypeMavenCentralRepository")
            task.dependsOn("publishArkivePluginMarkerMavenPublicationToSonatypeMavenCentralRepository")
        } else if (isKmpModule) {
            // One publication per KMP target plus the root — publish them all.
            task.dependsOn("publishAllPublicationsToSonatypeMavenCentralRepository")
        } else {
            task.dependsOn("publishReleasePublicationToSonatypeMavenCentralRepository")
        }
    }
}
