// Publishing via the vanniktech maven-publish plugin.
// It wires publications, sources/javadoc jars, POM metadata and Central Portal uploads
// for every module type used here: kotlin-jvm, kotlin-multiplatform, android library,
// and java-gradle-plugin (including the plugin marker). Configuration comes from
// gradle.properties: GROUP/VERSION_NAME at the root, POM_ARTIFACT_ID/POM_NAME/
// POM_DESCRIPTION per module, shared POM_* fields at the root.
//
// Deploy: ./gradlew publishToMavenCentral (upload, then release manually at
// central.sonatype.com/publishing) or ./gradlew publishAndReleaseToMavenCentral.
apply plugin: "com.vanniktech.maven.publish"

// The publish plugin sets publication coordinates but NOT the project's own
// group/version — and several things derive from the project ones: the KMP klib
// artifact names inside Gradle module metadata (a version-less name breaks the KLIB
// resolver on consumers), and :plugin's ArkiveVersion stamping via processResources.
group = project.findProperty("GROUP")
version = project.findProperty("VERSION_NAME")

mavenPublishing {
    pom {
        organization {
            name = "Infinum Inc."
            url = "https://infinum.com"
        }
    }

    // Central requires signatures, but the CI bootstrap runs publishToMavenLocal on
    // machines without a signing key — so only sign when one is configured.
    if (project.findProperty("signing.keyId") != null ||
        project.findProperty("signingInMemoryKey") != null) {
        signAllPublications()
    }
}
